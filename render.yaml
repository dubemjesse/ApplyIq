# Render Blueprint — deploy the whole stack in one go via
# https://dashboard.render.com/blueprints (New > Blueprint > point at this repo).
# You'll still need to fill in secret env vars (marked sync: false) in the
# Render dashboard after the first deploy — Render never accepts secrets
# committed to a blueprint file.
databases:
  - name: applyiq-postgres
    plan: free
    databaseName: applyiq
    user: applyiq

services:
  - type: redis
    name: applyiq-redis
    plan: free
    ipAllowList: [] # private network only

  - type: web
    name: applyiq-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: applyiq-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: applyiq-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # set to the deployed client's URL once you have it
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: GREENHOUSE_BOARDS
        sync: false
      - key: LEVER_BOARDS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: worker
    name: applyiq-worker
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    dockerCommand: npm run worker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: applyiq-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: applyiq-redis
          type: redis
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: applyiq-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to applyiq-server's public URL, then trigger a redeploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
